<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>本地调试</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body, div, img, button, input, span {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  input[type="text"] { -webkit-user-select: text; user-select: text; }
  body { background: #000; color: #e0e0e0; font-family: sans-serif; }
  #lockScreen {
    position: fixed; inset: 0; background: #000; z-index: 999;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    touch-action: none;
  }
  #unlockHint {
    color: #0f0; font-size: 18px; opacity: 0; transition: opacity 0.3s;
    pointer-events: none; text-align: center; font-weight: bold;
  }
  #searchBox {
    display: none; position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 25; padding: 8px 16px; border-radius: 20px; border: none;
    background: rgba(255,255,255,0.1); color: #fff; font-size: 14px; width: 50%; outline: none;
  }
  #albumView { padding: 8px; padding-top: 50px; display: none; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
  #albumView.list-view { display: block; padding-top: 50px; }
  #albumView.list-view .album { display: flex; align-items: center; padding: 8px; border-bottom: 1px solid #333; cursor: pointer; }
  #albumView.list-view .album img { width: 50px; height: 50px; aspect-ratio: auto; border-radius: 4px; margin-right: 12px; }
  #albumView.list-view .album .info { flex: 1; padding: 0; }
  #albumView.list-view .album .name { font-size: 14px; }
  #albumView.list-view .album .count { font-size: 12px; }
  .album { cursor: pointer; border-radius: 8px; overflow: hidden; background: #1e1e1e; position: relative; }
  .album img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; }
  .album .info { padding: 8px; }
  .album .name { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .album .count { font-size: 11px; color: #888; }
  .album .star { position: absolute; top: 4px; right: 4px; font-size: 18px; color: #ffd700; display: none; pointer-events: none; text-shadow: 0 0 4px rgba(0,0,0,0.8); }
  .album.starred .star { display: block; }
  #imageView { display: none; position: fixed; inset: 0; background: #000; z-index: 10; overflow: hidden; }
  #mediaContainer { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #mediaContainer img, #mediaContainer video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; display: block; transform: translateY(-35px); }
  #backBtn { position: fixed; top: 12px; left: 12px; z-index: 20; background: rgba(0,0,0,0.5); color: #fff; border: none; padding: 8px 16px; border-radius: 20px; font-size: 14px; cursor: pointer; }
  #counter { position: fixed; top: 12px; right: 12px; z-index: 20; background: rgba(0,0,0,0.5); color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 13px; }
  #gearBtn {
    display: flex !important; position: fixed !important;
    bottom: 20px !important; left: 20px !important; z-index: 9999 !important;
    background: rgba(255,255,255,0.3); color: #fff;
    border: 2px solid rgba(255,255,255,0.5); width: 48px; height: 48px;
    border-radius: 50%; font-size: 24px; cursor: pointer;
    align-items: center; justify-content: center;
  }
  #randomBtn, #starFilter, #viewToggle {
    position: fixed; top: 12px; z-index: 25; background: rgba(255,255,255,0.15); color: #fff;
    border: none; padding: 6px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; display: none;
  }
  #randomBtn { right: 80px; } #starFilter { right: 130px; } #viewToggle { right: 180px; }
  .edge-left { position: fixed; left: 0; top: 0; bottom: 0; width: 50px; z-index: 30; }
  .edge-right { position: fixed; right: 0; top: 0; bottom: 0; width: 50px; z-index: 30; }
  #toast {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.7); color: #fff; padding: 10px 24px; border-radius: 24px;
    font-size: 14px; z-index: 40; pointer-events: none; opacity: 0; transition: opacity 0.15s;
  }
  #settingsPanel {
    display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: #1e1e1e; border: 1px solid #444; border-radius: 12px; padding: 20px;
    z-index: 50; min-width: 220px;
  }
  #settingsPanel button {
    display: block; width: 100%; margin: 6px 0; padding: 10px;
    background: rgba(255,255,255,0.1); color: #fff; border: none; border-radius: 8px;
    font-size: 14px; cursor: pointer; text-align: left;
  }
  #settingsPanel button.active { background: rgba(255,215,0,0.3); font-weight: bold; }
  #settingsOverlay { display: none; position: fixed; inset: 0; z-index: 49; background: rgba(0,0,0,0.5); }
  #seekContainer {
    display: none; position: fixed; bottom: 100px; left: 20px; right: 20px; height: 140px;
    z-index: 35; align-items: center; justify-content: center;
  }
  #seekBar {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 8px; border-radius: 4px;
    background: rgba(255,255,255,0.15); outline: none; overflow: hidden;
  }
  #seekBar::-webkit-slider-runnable-track {
    height: 8px; border-radius: 4px;
    background: linear-gradient(to right, #4caf50 0%, #4caf50 var(--seek-pct), rgba(255,255,255,0.3) var(--seek-pct));
  }
  #seekBar::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 24px; height: 24px; border-radius: 50%;
    background: #fff; cursor: pointer; box-shadow: 0 0 6px rgba(0,0,0,0.5);
    margin-top: -8px;
  }
  #seekBubble {
    display: none; position: fixed; z-index: 36; pointer-events: none;
    background: rgba(0,0,0,0.8); color: #fff; padding: 4px 10px; border-radius: 12px;
    font-size: 12px; transform: translate(-50%, -100%);
  }
</style>
</head>
<body>
<div id="lockScreen"><div id="unlockHint">✓ 解锁成功</div></div>
<input type="text" id="searchBox" placeholder="搜索...">
<button id="starFilter" onclick="toggleStarFilter()">⭐</button>
<button id="randomBtn" onclick="randomAlbum()">🎲</button>
<button id="viewToggle" onclick="toggleView()">📋</button>
<div id="albumView"></div>
<div id="imageView">
  <div id="mediaContainer">
    <img id="mediaImg" src="" style="display:none;">
    <video id="mediaVideo" style="display:none;" autoplay loop muted playsinline></video>
  </div>
  <button id="backBtn" onclick="closeViewer()">← 返回</button>
  <div id="counter"></div>
  <button id="gearBtn" onclick="openSettings()">⚙</button>
  <div class="edge-left" id="edgeLeft"></div>
  <div class="edge-right" id="edgeRight"></div>
  <div id="toast"></div>
</div>
<div id="seekContainer"><input type="range" id="seekBar" min="0" max="100" value="0" step="1"></div>
<div id="seekBubble"></div>
<div id="settingsOverlay" onclick="closeSettings()"></div>
<div id="settingsPanel">
  <button onclick="setDisplayMode('B')" id="modeB">B · 自适应屏幕</button>
  <button onclick="setDisplayMode('C')" id="modeC">C · 自适应宽度</button>
  <button onclick="setDisplayMode('D')" id="modeD">D · 默认模式</button>
</div>
<script>
const RAW = 'https://raw.githubusercontent.com/linghaoyi0318/linghaoyi0318/main';
let albums = [], currentAlbum = '', currentImages = [], currentIndex = 0;
let startX = 0, startY = 0, toastTimer = null, pressTimer = null;
let showStarredOnly = false, isListView = false, displayMode = 'B';
let seekVisible = false, seekIgnoreChange = false;
const lockScreen = document.getElementById('lockScreen');
const albumView = document.getElementById('albumView');
const imageView = document.getElementById('imageView');
const mediaImg = document.getElementById('mediaImg');
const mediaVideo = document.getElementById('mediaVideo');
const seekContainer = document.getElementById('seekContainer');
const seekBar = document.getElementById('seekBar');
const seekBubble = document.getElementById('seekBubble');
const settingsPanel = document.getElementById('settingsPanel');
const settingsOverlay = document.getElementById('settingsOverlay');
const searchBox = document.getElementById('searchBox');
const randomBtn = document.getElementById('randomBtn');
const starFilter = document.getElementById('starFilter');
const viewToggle = document.getElementById('viewToggle');
const gearBtn = document.getElementById('gearBtn');
const unlockHint = document.getElementById('unlockHint');

function getStarred() { try { return JSON.parse(localStorage.getItem('gallery_starred') || '{}'); } catch (_) { return {}; } }
function setStarred(o) { localStorage.setItem('gallery_starred', JSON.stringify(o)); }
function getDisplayMode() { return localStorage.getItem('gallery_display_mode') || 'B'; }
function setDisplayMode(m) { displayMode = m; localStorage.setItem('gallery_display_mode', m); applyDisplayMode(); updateSettingsButtons(); closeSettings(); }
function applyDisplayMode() {
  var img = mediaImg; if (!img) return;
  img.style.cssText = ''; img.style.imageRendering = 'crisp-edges';
  imageView.style.overflow = 'hidden'; hideSeekBar();
  switch (displayMode) {
    case 'B': img.style.position = 'absolute'; img.style.inset = '0'; img.style.width = '100%'; img.style.height = '100%'; img.style.objectFit = 'contain'; break;
    case 'C': img.style.position = ''; img.style.inset = ''; img.style.width = '100%'; img.style.height = 'auto'; imageView.style.overflow = 'auto'; break;
    case 'D': img.style.position = 'absolute'; img.style.inset = '0'; img.style.width = '100%'; img.style.height = '100%'; img.style.objectFit = 'contain'; img.style.imageRendering = 'auto'; break;
  }
}
function updateSettingsButtons() { ['B','C','D'].forEach(function(m) { var b = document.getElementById('mode'+m); if(b) b.className = (displayMode===m)?'active':''; }); }
function openSettings() { updateSettingsButtons(); settingsPanel.style.display='block'; settingsOverlay.style.display='block'; }
function closeSettings() { settingsPanel.style.display='none'; settingsOverlay.style.display='none'; }
function toggleStar(path, e) { e.stopPropagation(); var s = getStarred(); s[path] = !s[path]; setStarred(s); renderAlbums(); }
function toggleStarFilter() { showStarredOnly = !showStarredOnly; starFilter.style.background = showStarredOnly ? 'rgba(255,215,0,0.4)' : 'rgba(255,255,255,0.15)'; renderAlbums(); }
function toggleView() { isListView = !isListView; albumView.className = isListView ? 'list-view' : ''; viewToggle.textContent = isListView ? '🟦' : '📋'; }
function randomAlbum() {
  var starred = getStarred();
  var pool = showStarredOnly ? albums.filter(function(a) { return starred[a.path]; }) : albums;
  if (pool.length === 0) pool = albums; if (pool.length === 0) return;
  openAlbum(pool[Math.floor(Math.random() * pool.length)]);
}
async function preloadAlbums() {
  try { var r = await fetch(RAW + '/albums.json'); albums = await r.json(); } catch (_) { albums = []; }
}
function renderAlbums() {
  var starred = getStarred(); var kw = searchBox.value.toLowerCase();
  var filtered = albums;
  if (showStarredOnly) filtered = filtered.filter(function(a) { return starred[a.path]; });
  if (kw) filtered = filtered.filter(function(a) { return a.name.toLowerCase().indexOf(kw) !== -1; });
  albumView.innerHTML = filtered.map(function(a) {
    var coverUrl = RAW + '/' + encodeURIComponent(a.path) + '/' + encodeURIComponent(a.cover);
    return '<div class="album' + (starred[a.path] ? ' starred' : '') + '" onclick="openAlbum(\'' + a.path + '\')">' +
      '<img src="' + coverUrl + '" loading="lazy">' +
      '<div class="star">⭐</div><div class="info"><div class="name">' + a.name + '</div><div class="count">' + a.count + ' 张</div></div></div>';
  }).join('');
  albumView.querySelectorAll('.album').forEach(function(el) {
    var path = el.getAttribute('onclick').match(/openAlbum\('(.+?)'\)/)[1], timer = null;
    el.addEventListener('touchstart', function(e) { timer = setTimeout(function() { toggleStar(path, e); }, 600); });
    el.addEventListener('touchend', function() { if (timer) clearTimeout(timer); });
    el.addEventListener('touchmove', function() { if (timer) clearTimeout(timer); });
  });
  albumView.className = isListView ? 'list-view' : '';
  albumView.style.display = isListView ? 'block' : 'grid';
  lockScreen.style.display = 'none';
  searchBox.style.display = randomBtn.style.display = starFilter.style.display = viewToggle.style.display = 'block';
}
searchBox.addEventListener('input', renderAlbums);
lockScreen.addEventListener('pointerdown', function(e) {
  e.preventDefault(); if (pressTimer) clearTimeout(pressTimer);
  pressTimer = setTimeout(function() { unlockHint.style.opacity = '1'; setTimeout(renderAlbums, 600); }, 2000);
});
lockScreen.addEventListener('pointerup', function() { if (pressTimer) clearTimeout(pressTimer); });
lockScreen.addEventListener('pointercancel', function() { if (pressTimer) clearTimeout(pressTimer); });
lockScreen.addEventListener('mousedown', function(e) { e.preventDefault(); });
function showToast(m) {
  var t = document.getElementById('toast'); t.textContent = m; t.style.opacity = '1';
  if (toastTimer) clearTimeout(toastTimer); toastTimer = setTimeout(function() { t.style.opacity = '0'; }, 800);
}
function loadProgress(p) {
  try { var d = JSON.parse(localStorage.getItem('gallery_progress') || '{}'); if (d[p] !== undefined) return d[p]; } catch (_) {}
  return 0;
}
function saveProgress() {
  try { var d = JSON.parse(localStorage.getItem('gallery_progress') || '{}'); d[currentAlbum] = currentIndex; localStorage.setItem('gallery_progress', JSON.stringify(d)); } catch (_) {}
}
function openAlbum(path) {
  var a = albums.find(function(x) { return x.path === path; });
  if (!a) return;
  currentAlbum = a.path; currentImages = a.images;
  currentIndex = loadProgress(path); displayMode = getDisplayMode();
  showImage();
  history.pushState({ view: 'image' }, '', '#image');
  albumView.style.display = 'none'; imageView.style.display = 'block';
  searchBox.style.display = randomBtn.style.display = starFilter.style.display = viewToggle.style.display = 'none';
}
function showImage() {
  if (currentImages.length === 0) return;
  var f = currentImages[currentIndex], url = RAW + '/' + encodeURIComponent(currentAlbum) + '/' + encodeURIComponent(f);
  var img = mediaImg, video = mediaVideo;
  video.style.display = 'none'; video.pause(); video.src = '';
  video.style.pointerEvents = 'none'; video.controls = false;
  img.style.display = 'block'; img.src = url;
  applyDisplayMode();
  if (seekVisible) {
    seekIgnoreChange = true;
    seekBar.max = currentImages.length - 1; seekBar.value = currentIndex;
    seekBar.style.setProperty('--seek-pct', (currentIndex / (currentImages.length - 1) * 100) + '%');
  }
  document.getElementById('counter').textContent = (currentIndex + 1) + ' / ' + currentImages.length;
  saveProgress();
}
function goNext() { if (currentIndex < currentImages.length - 1) { currentIndex++; showImage(); } else showToast('已经是最后一张'); }
function goPrev() { if (currentIndex > 0) { currentIndex--; showImage(); } else showToast('已经是第一张'); }
function closeViewer() {
  hideSeekBar(); imageView.style.display = 'none';
  albumView.className = isListView ? 'list-view' : '';
  albumView.style.display = isListView ? 'block' : 'grid';
  searchBox.style.display = randomBtn.style.display = starFilter.style.display = viewToggle.style.display = 'block';
  if (history.state && history.state.view === 'image') history.back();
}
window.addEventListener('popstate', function() { if (imageView.style.display === 'block') closeViewer(); });
imageView.addEventListener('touchstart', function(e) { startX = e.touches[0].clientX; startY = e.touches[0].clientY; }, { passive: true });
imageView.addEventListener('touchend', function(e) {
  var dx = startX - e.changedTouches[0].clientX, dy = Math.abs(startY - e.changedTouches[0].clientY);
  if (Math.abs(dx) > 50 && Math.abs(dx) > dy) { if (dx > 0) goPrev(); else goNext(); }
});
function showSeekBar() {
  if (currentImages.length === 0) return;
  seekBar.max = currentImages.length - 1; seekBar.value = currentIndex;
  seekBar.style.setProperty('--seek-pct', (currentIndex / (currentImages.length - 1) * 100) + '%');
  seekContainer.style.display = 'flex'; seekVisible = true;
}
function hideSeekBar() { seekContainer.style.display = 'none'; seekBubble.style.display = 'none'; seekVisible = false; }
seekBar.addEventListener('input', function() {
  var val = parseInt(this.value);
  seekBubble.style.display = 'block'; seekBubble.textContent = (val + 1) + ' / ' + currentImages.length;
  var rect = seekBar.getBoundingClientRect();
  var pct = (val - parseInt(this.min)) / (parseInt(this.max) - parseInt(this.min));
  seekBubble.style.left = (rect.left + pct * rect.width) + 'px';
  seekBubble.style.top = (rect.top - 30) + 'px';
  seekBar.style.setProperty('--seek-pct', (pct * 100) + '%');
});
seekBar.addEventListener('change', function() {
  seekBubble.style.display = 'none';
  if (!seekIgnoreChange) { currentIndex = parseInt(this.value); showImage(); }
  seekIgnoreChange = false;
});
imageView.addEventListener('click', function(e) {
  if (e.target === imageView || e.target === document.getElementById('mediaContainer')) {
    if (seekVisible) hideSeekBar(); else showSeekBar();
  }
});
document.getElementById('edgeLeft').addEventListener('click', function(e) { e.stopPropagation(); goNext(); });
document.getElementById('edgeRight').addEventListener('click', function(e) { e.stopPropagation(); goPrev(); });
document.addEventListener('keydown', function(e) {
  if (imageView.style.display === 'block') {
    if (e.key === 'ArrowLeft') { e.preventDefault(); goPrev(); }
    if (e.key === 'ArrowRight') { e.preventDefault(); goNext(); }
    if (e.key === 'Escape') { e.preventDefault(); closeViewer(); }
  }
});
preloadAlbums();
</script>
</body>
</html>
